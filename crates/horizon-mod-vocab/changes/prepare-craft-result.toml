ids = ["hook:prepare_item_craft_result", "type:PrepareItemCraftResultEvent", "method:Hooks::prepare_item_craft_result", "hook:prepare_smithing_result", "method:Hooks::prepare_smithing_result", "type:PrepareSmithingResultEvent"]
why = "A mod can clear or replace a result the recipe made. prepare_item_craft and prepare_smithing are asked only where no recipe matched (their result arrives empty), so prepare_item_craft_result and prepare_smithing_result are asked after them for every result: result arrives holding the recipe's result and a listener may set another stack or None, and inputs carries the grid (or the template, base and addition). The player is shown, and takes, what the last listener left. The two older hooks are unchanged."
migrate = "Nothing to change: additive. To lock or change a recipe's result, implement prepare_item_craft_result (and prepare_smithing_result) and write event.result."
